<style>
  .rt-img-zoomable {
    cursor: zoom-in;
    transition: transform .25s ease, filter .25s ease;
  }

  .rt-img-zoomable:hover {
    filter: brightness(.96);
  }

  .rt-lightbox {
    position: fixed;
    inset: 0;
    z-index: 99999;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px;
    background: rgba(0, 0, 0, 0);
    backdrop-filter: blur(0);
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition:
      opacity .28s ease,
      background .28s ease,
      backdrop-filter .28s ease,
      visibility 0s linear .28s;
  }

  .rt-lightbox.active {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
    background: rgba(0, 0, 0, .82);
    backdrop-filter: blur(10px);
    transition:
      opacity .28s ease,
      background .28s ease,
      backdrop-filter .28s ease,
      visibility 0s;
  }

  .rt-lightbox img {
    max-width: min(96vw, 1400px);
    max-height: 92vh;
    border-radius: 16px;
    box-shadow: 0 26px 90px rgba(0, 0, 0, .55);
    cursor: zoom-out;
    opacity: 0;
    transform: scale(.88) translateY(18px);
    transition:
      opacity .32s cubic-bezier(.2, .8, .2, 1),
      transform .32s cubic-bezier(.2, .8, .2, 1);
  }

  .rt-lightbox.active img {
    opacity: 1;
    transform: scale(1) translateY(0);
  }

  .rt-lightbox-close {
    position: fixed;
    top: 18px;
    right: 22px;
    width: 42px;
    height: 42px;
    border: 0;
    border-radius: 999px;
    background: rgba(255,255,255,.14);
    color: #fff;
    font-size: 28px;
    line-height: 42px;
    cursor: pointer;
    opacity: 0;
    transform: scale(.86) rotate(-8deg);
    transition:
      opacity .25s ease .08s,
      transform .25s ease .08s,
      background .2s ease;
  }

  .rt-lightbox.active .rt-lightbox-close {
    opacity: 1;
    transform: scale(1) rotate(0);
  }

  .rt-lightbox-close:hover {
    background: rgba(255,255,255,.24);
    transform: scale(1.06);
  }

  @media (prefers-reduced-motion: reduce) {
    .rt-img-zoomable,
    .rt-lightbox,
    .rt-lightbox img,
    .rt-lightbox-close {
      transition: none !important;
    }
  }
</style>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    const box = document.createElement('div');
    box.className = 'rt-lightbox';
    box.innerHTML = `
      <button class="rt-lightbox-close" aria-label="关闭">×</button>
      <img alt="">
    `;
    document.body.appendChild(box);

    const boxImg = box.querySelector('img');
    const closeBtn = box.querySelector('.rt-lightbox-close');

    function openLightbox(img) {
      boxImg.src = img.currentSrc || img.src;
      boxImg.alt = img.alt || '';

      requestAnimationFrame(function () {
        box.classList.add('active');
      });

      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      box.classList.remove('active');

      setTimeout(function () {
        if (!box.classList.contains('active')) {
          boxImg.src = '';
        }
      }, 300);

      document.body.style.overflow = '';
    }

    document.addEventListener('click', function (e) {
      const img = e.target.closest('main img, article img, .content img');
      if (!img) return;

      if (img.closest('a')) return;
      if ((img.src || '').includes('.svg')) return;
      if (img.classList.contains('no-zoom')) return;

      e.preventDefault();
      openLightbox(img);
    });

    closeBtn.addEventListener('click', closeLightbox);

    box.addEventListener('click', function (e) {
      if (e.target === box || e.target === boxImg) {
        closeLightbox();
      }
    });

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') closeLightbox();
    });

    document.querySelectorAll('main img, article img, .content img').forEach(function (img) {
      if (!img.closest('a') && !(img.src || '').includes('.svg')) {
        img.classList.add('rt-img-zoomable');
      }
    });
  });
</script>
