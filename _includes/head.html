<style>
  .rt-img-zoomable {
    cursor: zoom-in;
  }

  html.rt-lightbox-open,
  html.rt-lightbox-open body {
    overflow: hidden !important;
  }

  .rt-lightbox {
    position: fixed;
    inset: 0;
    z-index: 99999;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px;
    background: rgba(0, 0, 0, 0);
    backdrop-filter: blur(0);
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition:
      opacity .28s ease,
      background .28s ease,
      backdrop-filter .28s ease,
      visibility 0s linear .28s;
  }

  .rt-lightbox.active {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
    background: rgba(0, 0, 0, .82);
    backdrop-filter: blur(10px);
    transition:
      opacity .28s ease,
      background .28s ease,
      backdrop-filter .28s ease,
      visibility 0s;
  }

  .rt-lightbox img {
    max-width: min(96vw, 1400px);
    max-height: 92vh;
    border-radius: 16px;
    box-shadow: 0 26px 90px rgba(0, 0, 0, .55);
    cursor: zoom-out;
    opacity: 0;
    transform: scale(.88) translateY(18px);
    transition:
      opacity .32s cubic-bezier(.2, .8, .2, 1),
      transform .32s cubic-bezier(.2, .8, .2, 1);
  }

  .rt-lightbox.active img {
    opacity: 1;
    transform: scale(1) translateY(0);
  }

  .rt-lightbox-close {
    position: fixed;
    top: 18px;
    right: 22px;
    width: 42px;
    height: 42px;
    border: 0;
    border-radius: 999px;
    background: rgba(255,255,255,.14);
    color: #fff;
    font-size: 28px;
    line-height: 42px;
    cursor: pointer;
    opacity: 0;
    transform: scale(.86) rotate(-8deg);
    transition:
      opacity .25s ease .08s,
      transform .25s ease .08s,
      background .2s ease;
  }

  .rt-lightbox.active .rt-lightbox-close {
    opacity: 1;
    transform: scale(1) rotate(0);
  }

  .rt-lightbox-close:hover {
    background: rgba(255,255,255,.24);
    transform: scale(1.06);
  }

  @media (max-width: 768px) {
    .rt-lightbox {
      padding: 18px;
    }

    .rt-lightbox img {
      max-width: 96vw;
      max-height: 88vh;
      border-radius: 12px;
    }

    .rt-lightbox-close {
      top: 12px;
      right: 12px;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .rt-lightbox,
    .rt-lightbox img,
    .rt-lightbox-close {
      transition: none !important;
    }
  }
</style>

<script>
(function () {
  if (window.__RetypeImageLightboxReady__) return;
  window.__RetypeImageLightboxReady__ = true;

  const IMAGE_SELECTOR = 'main img, article img, .content img, .page img, .doc img';

  let lightbox = null;
  let lightboxImg = null;
  let closeTimer = null;
  let observer = null;
  let markTimer = null;

  function isSvg(src) {
    return /\.svg($|\?)/i.test(src || '');
  }

  function isZoomableImage(img) {
    if (!img || !img.matches || !img.matches(IMAGE_SELECTOR)) return false;
    if (img.closest('.rt-lightbox')) return false;
    if (img.classList.contains('no-zoom')) return false;

    const src = img.currentSrc || img.src || img.getAttribute('src') || '';
    if (!src || isSvg(src)) return false;

    return true;
  }

  function ensureLightbox() {
    if (!document.body) return null;

    lightbox = document.querySelector('.rt-lightbox');

    if (!lightbox) {
      lightbox = document.createElement('div');
      lightbox.className = 'rt-lightbox';
      lightbox.innerHTML = `
        <button class="rt-lightbox-close" type="button" aria-label="关闭">×</button>
        <img alt="">
      `;
      document.body.appendChild(lightbox);
    }

    lightboxImg = lightbox.querySelector('img');
    const closeBtn = lightbox.querySelector('.rt-lightbox-close');

    if (!lightbox.dataset.bound) {
      closeBtn.addEventListener('click', closeLightbox);

      lightbox.addEventListener('click', function (e) {
        if (e.target === lightbox || e.target === lightboxImg) {
          closeLightbox();
        }
      });

      lightbox.dataset.bound = '1';
    }

    return lightbox;
  }

  function openLightbox(img) {
    ensureLightbox();
    if (!lightbox || !lightboxImg) return;

    clearTimeout(closeTimer);

    const src = img.currentSrc || img.src || img.getAttribute('src');

    lightboxImg.src = src;
    lightboxImg.alt = img.alt || '';

    lightbox.classList.remove('active');

    requestAnimationFrame(function () {
      lightbox.classList.add('active');
      document.documentElement.classList.add('rt-lightbox-open');
    });
  }

  function closeLightbox() {
    if (!lightbox) return;

    lightbox.classList.remove('active');
    document.documentElement.classList.remove('rt-lightbox-open');

    clearTimeout(closeTimer);

    closeTimer = setTimeout(function () {
      if (lightbox && !lightbox.classList.contains('active') && lightboxImg) {
        lightboxImg.removeAttribute('src');
      }
    }, 320);
  }

  function markImages() {
    document.querySelectorAll(IMAGE_SELECTOR).forEach(function (img) {
      if (isZoomableImage(img)) {
        img.classList.add('rt-img-zoomable');
      } else {
        img.classList.remove('rt-img-zoomable');
      }
    });
  }

  function scheduleMarkImages() {
    clearTimeout(markTimer);
    markTimer = setTimeout(markImages, 80);
  }

  function initObserver() {
    if (observer) return;

    observer = new MutationObserver(function () {
      scheduleMarkImages();
      ensureLightbox();
    });

    observer.observe(document.documentElement, {
      childList: true,
      subtree: true
    });
  }

  document.addEventListener('click', function (e) {
    const img = e.target.closest ? e.target.closest(IMAGE_SELECTOR) : null;

    if (!isZoomableImage(img)) return;

    e.preventDefault();
    e.stopPropagation();

    openLightbox(img);
  }, true);

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      closeLightbox();
    }
  });

  function boot() {
    ensureLightbox();
    markImages();
    initObserver();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot, { once: true });
  } else {
    boot();
  }
})();
</script>
